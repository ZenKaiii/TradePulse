[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepulse"
version = "0.1.0"
description = "Importance-first AI news digest for traders"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "PyYAML>=6.0.2"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
