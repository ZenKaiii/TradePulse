name: TradePulse Daily Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 22 * * *"

jobs:
  run-hourly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore TradePulse state
        uses: actions/cache/restore@v4
        with:
          path: data/state.db
          key: tradepulse-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            tradepulse-state-${{ github.ref_name }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run TradePulse
        env:
          TRADEPULSE_CONFIG_PATH: ${{ vars.TRADEPULSE_CONFIG_PATH }}
          TRADEPULSE_TOP_N: ${{ vars.TRADEPULSE_TOP_N }}
          TRADEPULSE_MAX_AGE_HOURS: ${{ vars.TRADEPULSE_MAX_AGE_HOURS }}
          TRADEPULSE_MAX_PER_SOURCE: ${{ vars.TRADEPULSE_MAX_PER_SOURCE }}
          TRADEPULSE_SOURCE_PROFILE: ${{ vars.TRADEPULSE_SOURCE_PROFILE }}
          TRADEPULSE_SOURCE_TIER: ${{ vars.TRADEPULSE_SOURCE_TIER }}
          TRADEPULSE_MIN_HEALTH_SCORE: ${{ vars.TRADEPULSE_MIN_HEALTH_SCORE }}
          TRADEPULSE_STOCKS: ${{ vars.TRADEPULSE_STOCKS }}
          TRADEPULSE_KEYWORDS: ${{ vars.TRADEPULSE_KEYWORDS }}
          TRADEPULSE_GEOPOLITICS: ${{ vars.TRADEPULSE_GEOPOLITICS }}
          TRADEPULSE_CHANNELS: ${{ vars.TRADEPULSE_CHANNELS }}
          TRADEPULSE_MARKET_ENABLED: ${{ vars.TRADEPULSE_MARKET_ENABLED }}
          TRADEPULSE_MARKET_US_ENABLED: ${{ vars.TRADEPULSE_MARKET_US_ENABLED }}
          TRADEPULSE_MARKET_A_SHARE_ENABLED: ${{ vars.TRADEPULSE_MARKET_A_SHARE_ENABLED }}
          TRADEPULSE_MARKET_US_TOP_N: ${{ vars.TRADEPULSE_MARKET_US_TOP_N }}
          TRADEPULSE_MARKET_US_STOCK_FLOW_TOP_N: ${{ vars.TRADEPULSE_MARKET_US_STOCK_FLOW_TOP_N }}
          TRADEPULSE_MARKET_US_MARKET_FLOW_ENABLED: ${{ vars.TRADEPULSE_MARKET_US_MARKET_FLOW_ENABLED }}
          TRADEPULSE_MARKET_US_MARKET_FLOW_TOP_N: ${{ vars.TRADEPULSE_MARKET_US_MARKET_FLOW_TOP_N }}
          TRADEPULSE_MARKET_US_MARKET_FLOW_UNIVERSE_SIZE: ${{ vars.TRADEPULSE_MARKET_US_MARKET_FLOW_UNIVERSE_SIZE }}
          TRADEPULSE_MARKET_A_SHARE_TOP_N: ${{ vars.TRADEPULSE_MARKET_A_SHARE_TOP_N }}
          TRADEPULSE_MARKET_TIMEOUT_SEC: ${{ vars.TRADEPULSE_MARKET_TIMEOUT_SEC }}
          TRADEPULSE_LLM_ENABLED: ${{ vars.TRADEPULSE_LLM_ENABLED }}
          TRADEPULSE_LLM_PROVIDER: ${{ vars.TRADEPULSE_LLM_PROVIDER }}
          TRADEPULSE_LLM_DETAIL_TOP_N: ${{ vars.TRADEPULSE_LLM_DETAIL_TOP_N }}
          TRADEPULSE_LLM_TIMEOUT_SEC: ${{ vars.TRADEPULSE_LLM_TIMEOUT_SEC }}
          TRADEPULSE_LLM_TEMPERATURE: ${{ vars.TRADEPULSE_LLM_TEMPERATURE }}
          TRADEPULSE_BAILIAN_MODEL: ${{ vars.TRADEPULSE_BAILIAN_MODEL }}
          TRADEPULSE_BAILIAN_BASE_URL: ${{ vars.TRADEPULSE_BAILIAN_BASE_URL }}
          TRADEPULSE_GEMINI_MODEL: ${{ vars.TRADEPULSE_GEMINI_MODEL }}
          TRADEPULSE_GEMINI_BASE_URL: ${{ vars.TRADEPULSE_GEMINI_BASE_URL }}
          TRADEPULSE_SEARCH_ENABLED: ${{ vars.TRADEPULSE_SEARCH_ENABLED }}
          TRADEPULSE_SEARCH_PROVIDER: ${{ vars.TRADEPULSE_SEARCH_PROVIDER }}
          TRADEPULSE_SEARCH_TOP_N: ${{ vars.TRADEPULSE_SEARCH_TOP_N }}
          TRADEPULSE_SEARCH_MAX_RESULTS: ${{ vars.TRADEPULSE_SEARCH_MAX_RESULTS }}
          TRADEPULSE_SEARCH_TIMEOUT_SEC: ${{ vars.TRADEPULSE_SEARCH_TIMEOUT_SEC }}
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python -m tradepulse.cli run

      - name: Save TradePulse state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.db
          key: tradepulse-state-${{ github.ref_name }}-${{ github.run_id }}
